name: Overnight forensics synthetic gates

on:
  pull_request:
    paths:
      - "study/overnight_forensics/**"
      - ".github/workflows/overnight-forensics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Exact-head synthetic study tests (serial, no private data)
        run: python -m pytest -q study/overnight_forensics
