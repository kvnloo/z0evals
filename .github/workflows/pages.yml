name: pages

# One Pages site, one artifact, every channel published as a mapped subpath.
#
# GitHub Pages (Actions build type) publishes a SINGLE site per repository, and
# actions/deploy-pages replaces the whole site. So a deploy triggered by one
# channel must build ALL channels: a per-branch deploy would wipe the others.
#
# Git channel names are NOT URL folders. Paths come from
# .verified-oss-loop/pages-url-map.py:
#
#   main    -> /z0evals/           (default)
#   nightly -> /z0evals/nightly/
#   preview -> /z0evals/next/      (never /preview/ — that is the AODL collision)
#   dev     -> /z0evals/dev/
#
# Each channel is built from its own branch tip, so a channel site always shows
# that channel's content.
#
# Trigger note: only `push` (from a non-token actor) fires before this file is on
# the default branch. `schedule` and `workflow_run` are read from the default
# branch, so they activate once this reaches `main`.
#
# Deploy note: the `github-pages` environment has a custom branch policy. It now
# admits all four channel branches (main, dev, nightly, preview), so any channel
# can publish. The deploy job is still gated to the channel allow-list so a
# `workflow_dispatch` from some other ref cannot try, and so a rejected deploy
# never shows up as a red run (that failure mode — build success, deploy failure
# with zero steps, run 35666392926 — is what the gate originally prevented).

on:
  push:
    branches: [main, dev, nightly, preview]

  # The promote/automerge workflows merge with secrets.GITHUB_TOKEN, and GitHub
  # does not trigger workflows from a push made with the default token. Without
  # these, a promoted channel would never rebuild its site (observed: merging
  # #34 into preview produced no push-event run at all).
  workflow_run:
    workflows: ["Automerge preview", "Automerge nightly", "Promote preview to nightly"]
    types: [completed]

  # safety net for any path that still bypasses the triggers above
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run fires for failed runs too; never rebuild from a failed promote.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      BASE: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout (all channel branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check the publish URL map
        run: |
          set -euo pipefail
          python3 .verified-oss-loop/pages-url-map.py check --root . --base "$BASE"

      - name: Build every channel
        run: |
          set -euo pipefail
          rm -rf site _channels
          mkdir -p site _channels
          built=""

          for BRANCH in main nightly preview dev; do
            if ! git rev-parse --verify -q "origin/$BRANCH" >/dev/null; then
              echo "::warning::channel $BRANCH has no origin branch — skipped"
              continue
            fi

            DEST=$(python3 .verified-oss-loop/pages-url-map.py path \
                     --branch "$BRANCH" --base "$BASE" --root .)
            if [ -z "$DEST" ]; then
              echo "channel $BRANCH is unpublished by config — skipped"
              continue
            fi

            SUB="${DEST#"$BASE"}"          # "next/", "dev/", "" for main
            WT="_channels/$BRANCH"
            git worktree add --force --detach "$WT" "origin/$BRANCH" >/dev/null

            # Next's basePath has no trailing slash; SUB is "next/", "dev/" or "".
            CHANNEL_BASE="/${GITHUB_REPOSITORY#*/}/${SUB%/}"
            ok=no
            if [ -f "$WT/web/package.json" ]; then
              # Migrated channel: build the ported template.
              if ( cd "$WT" \
                   && python3 scripts/validate.py \
                   && python3 scripts/build_site_data.py \
                   && cd web \
                   && npm ci --no-audit --no-fund \
                   && Z0_BASE_PATH="$CHANNEL_BASE" npx next build ); then
                mkdir -p "site/$SUB"
                cp -R "$WT/web/out/." "site/$SUB"
                ok=yes
                echo "built $BRANCH -> $DEST  (next, basePath=$CHANNEL_BASE)"
              fi
            elif [ -f "$WT/scripts/build_site.py" ]; then
              # Channel not migrated yet: keep publishing its legacy build so a
              # partially promoted chain never blanks the root path. This is a
              # migration bridge, not a second site.
              if ( cd "$WT" && python3 scripts/validate.py && python3 scripts/build_site.py ); then
                mkdir -p "site/$SUB"
                cp -R "$WT/site/." "site/$SUB"
                ok=yes
                echo "built $BRANCH -> $DEST  (legacy fallback: web/ not present on this branch)"
              fi
            fi
            if [ "$ok" = yes ]; then
              built="$built $BRANCH"
            else
              if [ "$BRANCH" = main ]; then
                echo "::error::main failed to build; refusing to publish a partial site"
                exit 1
              fi
              echo "::warning::$BRANCH failed to build — omitted from this deploy"
            fi
            git worktree remove --force "$WT" >/dev/null 2>&1 || true
          done

          if [ ! -f site/index.html ]; then
            echo "::error::no main build at site/index.html; refusing to publish"
            exit 1
          fi
          echo "--- published tree ---"
          find site -maxdepth 2 -name index.html | sort

          # Landing page for the channel sites. The per-channel builds are left
          # untouched; this only adds an index one level above them.
          {
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>z0evals channels</title>'
            echo '<style>body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;'
            echo 'max-width:720px;margin:0 auto;padding:64px 24px;line-height:1.6;color:#111}'
            echo 'h1{font-size:1.4rem;margin:0 0 8px}p{color:#666;margin:0 0 28px}'
            echo 'ul{list-style:none;padding:0;margin:0}li{padding:12px 0;border-top:1px solid #eee}'
            echo 'a{color:#111;text-decoration:none;font-weight:600}a:hover{text-decoration:underline}'
            echo 'code{color:#666;font-weight:400;font-size:.9em}</style></head><body>'
            echo '<h1>z0evals</h1><p>Published per git channel. Each is built from its own branch tip.</p><ul>'
            for BRANCH in main nightly preview dev; do
              DEST=$(python3 .verified-oss-loop/pages-url-map.py path \
                       --branch "$BRANCH" --base "$BASE" --root . 2>/dev/null || true)
              [ -n "$DEST" ] || continue
              case " $built " in *" $BRANCH "*) ;; *) continue ;; esac
              REL="${DEST#"$BASE"}"
              [ -n "$REL" ] || REL="./"          # main publishes at the site root
              printf '  <li><a href="%s">%s</a> <code>%s</code></li>\n' \
                "$REL" "$BRANCH" "$DEST"
            done
            echo '</ul></body></html>'
          } > site/channels.html

          echo "channels built:$built"
          find site -maxdepth 2 -name index.html | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Channel branches only. Kept in step with the github-pages environment
    # branch policy, which admits exactly these. `schedule` and `workflow_run`
    # resolve to the default branch, so both deploy.
    if: contains(fromJSON('["main","dev","nightly","preview"]'), github.ref_name)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify every published channel
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"

          check() {
            local suffix="$1" needle="$2"
            local url="$base/$suffix"
            for i in $(seq 1 12); do
              if curl -fsSL "$url" -o /tmp/chan.html &&
                 grep -Fq "z0evals" /tmp/chan.html &&
                 { [ -z "$needle" ] || grep -Fq "$needle" /tmp/chan.html; }; then
                echo "ok   $url"
                return 0
              fi
              sleep 5
            done
            echo "FAIL $url (expected content marker: ${needle:-<title>z0evals})" >&2
            return 1
          }

          fail=0
          check "" "How z0evals Fits Into Zer0" || fail=1
          check "channels.html" "z0evals channels" || fail=1
          for ch in nightly next dev; do
            if curl -fsS -o /dev/null "$base/$ch/"; then
              check "$ch/" "" || fail=1
            else
              echo "note /$ch/ not published for this run"
            fi
          done
          exit "$fail"
