name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate studies
        run: python scripts/validate.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for i in {1..12}; do
            if curl -fsSL "$base/posts/slm-router-v0.html" -o /tmp/report.html &&
               curl -fsSL "$base/posts/eval-architecture.html" -o /tmp/architecture.html &&
               grep -Fq "MOCK DATA · UI PROTOTYPE" /tmp/report.html &&
               grep -Fq "How z0evals Fits Into Zer0" /tmp/architecture.html; then
              echo "live Pages verified at $base"
              exit 0
            fi
            sleep 5
          done
          echo "Pages deployment completed but live content verification failed" >&2
          exit 1
