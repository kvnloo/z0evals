name: AgentWeb Context E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout z0evals study
        uses: actions/checkout@v4
        with:
          path: evals

      - name: Checkout z0intelligence fork branch
        uses: actions/checkout@v4
        with:
          repository: kvnloo/z0intelligence
          ref: lab/agentweb-emma-v0
          path: deps/z0intelligence
          persist-credentials: false

      - name: Checkout AgentWeb fork branch
        uses: actions/checkout@v4
        with:
          repository: kvnloo/agentweb
          ref: lab/z0-agentweb-emma-v0
          path: deps/agentweb
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deps/agentweb/backend/package-lock.json

      - name: Record exact dependency heads
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          roots = {
              "z0evals": "evals",
              "z0intelligence": "deps/z0intelligence",
              "agentweb": "deps/agentweb",
          }
          out = {
              name: subprocess.check_output(
                  ["git", "-C", path, "rev-parse", "HEAD"], text=True
              ).strip()
              for name, path in roots.items()
          }
          Path("/tmp/agentweb-context-heads.json").write_text(
              json.dumps(out, indent=2) + "\n"
          )
          print(json.dumps(out, indent=2))
          PY

      - name: Install AgentWeb dependencies
        working-directory: deps/agentweb/backend
        run: npm ci

      - name: Start z0intelligence context service
        env:
          Z0INT_HOME: /tmp/z0int-home
          PYTHONPATH: ${{ github.workspace }}/deps/z0intelligence/src
        run: |
          mkdir -p "$Z0INT_HOME"
          python -m z0int.intelligence_service --port 11501 > /tmp/z0int-service.log 2>&1 &
          echo $! > /tmp/z0int-service.pid
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:11501/healthz"
          last = None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          print("z0intelligence ready")
                          raise SystemExit(0)
              except Exception as exc:
                  last = exc
                  time.sleep(.25)
          raise SystemExit(f"z0intelligence did not become ready: {last}")
          PY

      - name: Run 18-case cross-repo context campaign
        working-directory: deps/agentweb/backend
        env:
          Z0INT_SERVICE_URL: http://127.0.0.1:11501
        run: |
          npm run study:z0-context-packet --             ../../../evals/studies/agentweb-emma-z0-v0/context-packet-fixtures.jsonl             /tmp/agentweb-context-results.jsonl

      - name: Score context campaign
        run: |
          python evals/scripts/score_agentweb_context_packet.py             /tmp/agentweb-context-results.jsonl             --output /tmp/agentweb-context-summary.json
          cat /tmp/agentweb-context-summary.json
          python - <<'PY'
          import json
          s = json.load(open("/tmp/agentweb-context-summary.json"))
          assert s["n_fixture"] == 18
          hard = [
              "fixture_required_terms_preserved",
              "packet_budget_respected",
              "source_labels_private",
              "shadow_never_applied",
              "private_text_not_persisted",
              "zero_model_calls",
              "source_diversity_or_explicit_budget_degradation",
              "gap_semantics_match",
              "fixture_large_context_compression_under_80pct",
          ]
          failed = [name for name in hard if s["gates"].get(name) is not True]
          assert not failed, failed
          assert s["gates"]["minimum_live_sample"] is False
          assert s["eligible_for_assist_review"] is False
          PY

      - name: Stop z0intelligence
        if: always()
        run: |
          if test -f /tmp/z0int-service.pid; then
            kill "$(cat /tmp/z0int-service.pid)" || true
          fi
          cat /tmp/z0int-service.log || true

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentweb-context-e2e
          path: |
            /tmp/agentweb-context-heads.json
            /tmp/agentweb-context-results.jsonl
            /tmp/agentweb-context-summary.json
            /tmp/z0int-service.log
