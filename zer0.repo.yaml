version: 1
repo: kvnloo/z0evals
id: z0evals
kind: suite
summary: Frozen evaluation and publication surface for reproducible Zer0 studies, including unified memory and SLM routing.

architecture:
  subsystems:
    - id: study-contracts
      name: Frozen study contracts
      kind: evidence
      summary: Pins study manifests, question/metric contracts, schemas, and reproducible inputs independently from the systems under evaluation.
      paths:
        - studies/
        - schemas/
        - imports/

    - id: unified-memory-v0
      name: Unified Memory v0
      kind: evaluation
      summary: Compares retrieval, model-visible injection, answer support, provenance, abstention, idempotency, supersession, latency, and context cost across harnesses.
      paths:
        - studies/unified-memory-v0/
        - posts/unified-memory-v0.md
        - web/app/unified-memory-v0/
      depends_on: [study-contracts]

    - id: slm-router-v0
      name: SLM Router v0
      kind: evaluation
      summary: Freezes bounded-routing evidence and compares candidate decision paths without allowing the evaluated router to grade itself.
      paths:
        - studies/slm-router-v0/
        - posts/slm-router-v0.md
      depends_on: [study-contracts]

    - id: publication
      name: Research publication surface
      kind: presentation
      summary: Publishes reproducible study narratives, figures, charts, and frozen artifacts while keeping source claims resolvable to study evidence.
      paths:
        - posts/
        - web/
        - research-ui.js
      depends_on: [study-contracts]

  implements_mechanisms:
    - frozen-eval-publication

  provides_interfaces: []
  consumes_interfaces: []

  produces_representations:
    - evaluation-artifact

  consumes_representations:
    - context-packet
    - decision-receipt
    - tokenomics-event

  boundaries:
    owns:
      - frozen study contracts
      - public evaluation artifacts
      - reproducible analyses and figures
      - publication evidence
    not_here:
      - model routing policy
      - memory database authority
      - experiment optimization
      - runtime verification authority

  evidence:
    docs:
      - README.md
      - studies/unified-memory-v0/README.md
      - studies/slm-router-v0/README.md
    tests:
      - tests/
    schemas:
      - schemas/
      - studies/unified-memory-v0/receipt.schema.json

# Repo-local onboarding steps (kvnloo/z0 onboard design §2.6, §8.2). z0 reads this
# block only from the pinned SHA in its mirror, never from a working tree. The z0
# registry owns host-level and cross-repo steps and wins on a duplicate step id.
# So each step here uses the z0 registry's id for the same step (z0evals.t0.*,
# z0evals.venv, z0evals.deps, z0evals.t1.*, z0evals.web.*): a different id would make
# z0 plan it twice. Facts in `when:` are z0 host-profile facts (network.npmjs, ...).
# Each step uses the closed step kinds of kvnloo/z0 schemas/onboard-step.schema.json.
# `where: build` is the component tree: a clean adopted checkout or a z0-owned clone.
# argv only (no shell); the working directory is the component tree. Web steps use
# `npm --prefix web` because the step schema has no cwd and next resolves data from cwd.
# The onboarder never runs: scripts/promote.sh, scripts/verify_channels.py,
# .github/scripts/create-labels.sh, gitnexus analyze, any unit or service, and it
# never reads ~/.z0int or ~/.hermes.
setup:
  version: 1
  python: {window: ">=3.10", prefer: "3.12", venv: .venv}
  node: {min: "20.9.0", prefer: "22", package_manager: npm, lockfile: web/package-lock.json}
  # Each tier passes before the next one starts. The python and web tiers follow
  # .github/workflows/ci.yml in order.
  tiers:
    - id: preflight
      summary: stdlib only, any python3 >= 3.10, before any install
      steps: [z0evals.t0.rollout, z0evals.t0.pages_map, z0evals.t0.arm_identity, z0evals.t0.expire_claims]
    - id: python
      summary: venv plus requirements.txt, then the CI python steps; no network after pip
      steps: [z0evals.venv, z0evals.deps, z0evals.t1.pages, z0evals.t1.validate, z0evals.t1.expire_claims, z0evals.t1.optchat_validate, z0evals.t1.optchat_tests, z0evals.t1.audit_source, z0evals.t1.build_site, z0evals.t1.site_data, z0evals.t1.posts, z0evals.t1.posts_tests]
    - id: web
      summary: needs the npm registry, Google Fonts (next/font/google) and node >= 20.9; else unavailable(offline|node)
      when: &web_gate
        - {fact: network.fonts_google, op: eq, value: true}
        - {fact: network.npmjs, op: eq, value: true}
        - {fact: toolchains.node.version, op: ge, value: "20.9.0"}
      steps: [z0evals.web.deps, z0evals.web.typecheck, z0evals.web.build, z0evals.web.audit]
  steps:
    # preflight
    - {id: z0evals.t0.rollout, component: z0evals, kind: check, consent: {class: C0}, where: build,
       argv: [python3, .verified-oss-loop/rollout.py, show]}
    - {id: z0evals.t0.pages_map, component: z0evals, kind: check, consent: {class: C0}, where: build,
       argv: [python3, .verified-oss-loop/pages-url-map.py, check, --root, ., --base, /z0evals]}
    - {id: z0evals.t0.arm_identity, component: z0evals, kind: check, consent: {class: C0}, where: build,
       argv: [python3, tests/test_arm_identity.py]}
    - {id: z0evals.t0.expire_claims, component: z0evals, kind: check, consent: {class: C0}, where: build,
       argv: [python3, tests/expire_claims.py]}
    # python
    - {id: z0evals.venv, component: z0evals, kind: venv, consent: {class: C0}, where: venv,
       needs: [z0evals.t0.rollout, z0evals.t0.pages_map, z0evals.t0.arm_identity, z0evals.t0.expire_claims],
       argv: [python3, -m, venv, .venv], probe: {argv: [.venv/bin/python, -c, "import sys; assert sys.version_info >= (3, 10)"]},
       undo: {kind: remove_owned}}
    - {id: z0evals.deps, component: z0evals, kind: pip_install, consent: {class: C0}, where: venv, network: true,
       needs: [z0evals.venv], argv: [.venv/bin/python, -m, pip, install, -r, requirements.txt],
       probe: {argv: [.venv/bin/python, -c, "import yaml, jsonschema, markdown"]}, undo: {kind: remove_owned}}
    - {id: z0evals.t1.pages, component: z0evals, kind: check, consent: {class: C0}, where: build,
       needs: [z0evals.deps], argv: [.venv/bin/python, -m, unittest, discover, -s, tests, -p, test_pages_publication.py, -v]}
    - {id: z0evals.t1.validate, component: z0evals, kind: check, consent: {class: C0}, where: build,
       needs: [z0evals.t1.pages], argv: [.venv/bin/python, scripts/validate.py]}
    - {id: z0evals.t1.expire_claims, component: z0evals, kind: check, consent: {class: C0}, where: build,
       needs: [z0evals.t1.validate], argv: [.venv/bin/python, tests/expire_claims.py]}
    - {id: z0evals.t1.optchat_validate, component: z0evals, kind: check, consent: {class: C0}, where: build,
       needs: [z0evals.t1.expire_claims], argv: [.venv/bin/python, scripts/validate_optchat_publication.py]}
    - {id: z0evals.t1.optchat_tests, component: z0evals, kind: check, consent: {class: C0}, where: build,
       needs: [z0evals.t1.optchat_validate], argv: [.venv/bin/python, -m, unittest, discover, -s, tests, -p, test_optchat_publication.py, -v]}
    - {id: z0evals.t1.audit_source, component: z0evals, kind: check, consent: {class: C0}, where: build,
       needs: [z0evals.t1.optchat_tests], argv: [.venv/bin/python, scripts/audit_web_source.py]}
    - {id: z0evals.t1.build_site, component: z0evals, kind: run, consent: {class: C0}, where: build,
       needs: [z0evals.t1.audit_source], argv: [.venv/bin/python, scripts/build_site.py],
       probe: {argv: [test, -f, site/index.html]}, verify: {argv: [test, -f, site/index.html]}, undo: {kind: none}}
    # build_site_data.py must run before any npm typecheck/dev/build (B5).
    - {id: z0evals.t1.site_data, component: z0evals, kind: run, consent: {class: C0}, where: build,
       needs: [z0evals.t1.build_site], argv: [.venv/bin/python, scripts/build_site_data.py],
       probe: {argv: [test, -f, web/data/optchat-long-horizon-v0.json]}, verify: {argv: [test, -f, web/data/optchat-long-horizon-v0.json]}, undo: {kind: none}}
    - {id: z0evals.t1.posts, component: z0evals, kind: run, consent: {class: C0}, where: build,
       needs: [z0evals.t1.site_data], argv: [.venv/bin/python, scripts/build_posts.py],
       probe: {argv: [test, -d, web/data/posts]}, verify: {argv: [test, -f, web/data/research-focus.html]}, undo: {kind: none}}
    - {id: z0evals.t1.posts_tests, component: z0evals, kind: check, consent: {class: C0}, where: build,
       needs: [z0evals.t1.posts], argv: [.venv/bin/python, -m, unittest, discover, -s, tests, -p, test_build_posts.py, -v]}
    # web (npm only; keep optional deps: the platform natives are optional deps)
    - {id: z0evals.web.deps, component: z0evals, kind: run, consent: {class: C0}, where: build, network: true, when: *web_gate,
       needs: [z0evals.t1.posts_tests], argv: [npm, --prefix, web, ci, --no-audit, --no-fund],
       probe: {argv: [test, -x, web/node_modules/.bin/next]}, undo: {kind: none}}
    - {id: z0evals.web.typecheck, component: z0evals, kind: check, consent: {class: C0}, where: build, when: *web_gate,
       needs: [z0evals.web.deps], argv: [npm, --prefix, web, run, typecheck]}
    - {id: z0evals.web.build, component: z0evals, kind: run, consent: {class: C0}, where: build, network: true, when: *web_gate,
       needs: [z0evals.web.typecheck], argv: [npm, --prefix, web, run, build], env: {Z0_BASE_PATH: /z0evals},
       probe: {argv: [test, -f, web/out/index.html]}, verify: {argv: [test, -f, web/out/index.html]}, undo: {kind: none}}
    - {id: z0evals.web.audit, component: z0evals, kind: check, consent: {class: C0}, where: build, when: *web_gate,
       needs: [z0evals.web.build], argv: [.venv/bin/python, scripts/audit_web_export.py, --root, web/out]}
  post_check:
    # `git status --porcelain` after all tiers. The committed web/data/study.json
    # was built with the openjev corpus present, so a build without it rewrites
    # only its matrixOrigin line (B3, maintainer to regenerate). Report anything else.
    porcelain_allowlist:
      - " M web/data/study.json"
    # Only when ~/tmp/openjev/results/phase1b/p1b-20260921T1430Z/observations.jsonl exists (B3).
    porcelain_allowlist_with_openjev_corpus:
      - " M studies/slm-router-v0/data/phase1b-matrix.json"
      - " M web/data/study.json"
  # Known conflicts for the maintainer. The onboarder reports them and does not resolve them.
  open_issues:
    - id: B7
      summary: prompt.md says the stable scheme (branch from origin/main); rollout.yml, AGENTS.md and CONTRIBUTING.md say rolling with base nightly. `rollout.py show` is the authority until the maintainer decides.
    - id: B8
      summary: single-branch or shallow clones see only origin/main, but Pages and the contributor flow need main, dev, nightly and preview (`git fetch origin main dev nightly preview`). research-log.json links studies/fsm-work-item-v0 at a SHA not on main; docs/verified-oss-loop.md references the missing tests/fixtures/issues-tiny.json.
