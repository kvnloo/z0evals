limitations:
  - The Index is Nous Research's measurement in their harness configuration; z0evals did not reproduce it.
  - The page carries no publication date; captured_at (2026-11-03T20:32:51Z) is the only time bound.
  - Hermes Bench (the fourth suite, 150 tasks) is not public, so the Index itself cannot be recomputed.
  - Identity mapping is by model family name; the served alias may not be the evaluated checkpoint.
  - Rows the page marks provisional keep "[provisional]" in the benchmark name downstream.

claims:
  - id: prior-not-acceptance
    text: Hermes Index rows enter the O14 catalog only as external_benchmark entries and never set task-class p_accept.
    evidence: [data/benchmark-rows-20261103T2032Z.json]
