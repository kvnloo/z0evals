questions:
  - What does the published Hermes Index say about each model, and which of its numbers are provisional?
  - Which of its four suites can we run ourselves, with which harness command and license?
  - Can the Hermes-agent-in-Harbor path run and grade one public-suite task on a free lane, end to end?

