limitations:
  - Ongoing bounded attempt, not full paper replication. Final run closure and counts remain parent-owned.
  - Library ingress avoids per-home gateway startup; corrected normal CLI, failed thinking-off CLI, and passing library smokes remain separate.
  - Optional Qwen Groq root is blocked by HTTP 403 and has no claimed primary measurements.
  - The thinking-off change followed the interrupted pilot and was not preregistered. Pilot and smoke never enter primary scores.
  - Different models, adapted tool prompts, nominal size labels, heuristic character truncation, and nano child agents differ from paper-v1.
  - One task per CodeQA size cannot support a task-population confidence interval even with three repeats.
  - Shared corpora, convenience sampling, incomplete valid repeats, and tiny task counts limit interpretation of descriptive intervals.
  - BrowseComp 20 by 1000 documents and large Parquet task materialization remain blocked by external compute availability.
  - Partial provider usage remains known-only; invalid executions are not wrong answers and missing executions are not zero scores.
  - No exact S-NIAH paper chart numbers were recovered. Source-reported Qwen numbers are not our measurements.
