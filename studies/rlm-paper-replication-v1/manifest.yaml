limitations:
- Bounded subset completed, not full paper replication; 123 valid outcomes include base and nano reference deviations,
  not 123 adherent Hermes outcomes.
- Strict post-adjudication preserves collection negatives; follow-up repaired plugin and runner were not measured
  by this matrix.
- Nano 3072-token agent completion budget is inherited by children; plugin children use a 1536 per-call cap, so
  child limits are not matched.
- P1 review verified missing host-validated FINAL/citations in collected valid rows and reproduced masking of failed
  children by a later root 200.
- Library ingress avoids per-home gateway startup; normal CLI, failed thinking-off CLI, and process-level library
  smokes remain separate.
- Optional Qwen Groq root is blocked by HTTP 403 and has no claimed primary measurements.
- The thinking-off change followed the interrupted pilot and was not preregistered. Pilot and smoke never enter
  primary scores.
- Different models, adapted tool prompts, nominal size labels, heuristic character truncation, and nano child agents
  differ from paper-v1.
- One task per CodeQA size cannot support a task-population confidence interval even with three repeats.
- Shared corpora, convenience sampling, incomplete valid repeats, and tiny task counts limit interpretation of descriptive
  intervals.
- BrowseComp 20 by 1000 documents and large Parquet task materialization remain blocked by external compute availability.
- Partial provider usage remains known-only; invalid executions are not wrong answers and missing executions are
  not zero scores.
- No exact S-NIAH paper chart numbers were recovered. Source-reported Qwen numbers are not our measurements.
