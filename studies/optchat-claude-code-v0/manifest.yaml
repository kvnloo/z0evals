questions:
- Do the parts of the design exercised here behave as the specification describes?
- In one short chat, what does UniiChat cost against a continued Claude Code session, a comparison introduced by
  this study?
- What do 512-byte lines keep after forced merges in a dense synthetic corpus?
- Does a longer tool-heavy replay reach the real bounded-view regime and a cost crossover?
- How does compactor effort affect per-line cost, fit, downstream recall and tool discipline?
- Which overhead and cache-lifetime effects are measured through Claude Code, and which pi results are paper estimates?
