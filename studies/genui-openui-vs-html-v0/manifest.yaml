limitations:
  - Source-reported local measurement; not independently reproduced.
  - One model, one harness, one provider account, two repetitions per case.
  - The HTML arm is an unbounded interactive page; the openui arm is a bounded four-chart catalog. Formats are not equal-capability.
  - The HTML check only confirms a fence and the expected numbers; it does not render or grade the chart.
  - The generation sweep's default model id was not recorded.
  - The in-T3 run pasted catalog instructions into each message; T3 Code did not supply them.
  - Synthetic fixtures; file paths in fixtures and stored programs are anonymized.
