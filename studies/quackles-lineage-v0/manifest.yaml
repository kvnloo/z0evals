limitations:
- Source-reported. No render, review or density audit was re-run for this study.
- The lineage snapshot ends 2026-10-15; its current cards show Day r115 and Night it12, not the 2026-10-16 picks
  in review-picks.json.
- Dates for 640 of 665 versions are file mtimes, not creation receipts.
- Every pick is an agent pick pending the owner. No scene is owner-approved.
- The overnight trials are transcribed from an operator log. Reviewers are model subagents, not people.
- Texel densities are representative medians from a sampled 160x240 camera grid, not a full-frame certification.
- Crop images are compositor-off surface diagnostics at 32 samples; they are not the final look.
- No phone frame-budget gate or 120 Hz device proof exists for the timeline or the deep-zoom viewer.
