limitations:
  - No real-video evaluation yet; every NOOP number is from synthetic signals or rendered frames.
  - Literature rows are source-reported on public datasets (COHFACE, BP4D+, MAHNOB-HCI, AFRL) and one prospective phone study; none reports inhale/exhale/hold phase accuracy.
  - The breath-to-HR lag includes an unmeasured Bluetooth R-R delivery delay.
  - Single subject planned for the first clip set; AGENTS.md asks for varying subjects/sessions before the method drives anything.
  - On-device latency on the S25 not yet captured.

claims:
  - id: motion-beats-rppg
    text: Chest/shoulder motion methods outperform face rPPG and face deep models for camera respiration rate on the cited benchmark.
    evidence: [data/literature.json]
    type: source-reported
  - id: synthetic-recovery
    text: The NOOP estimator recovers several injected rates (4-15 br/min), holds, lags and resonance peaks on synthetic input.
    evidence: [data/synthetic-tests.json]
    type: reproduced-measurement-synthetic
