schema_version: z0eval.study.v1
id: breath-phase-camera
title: On-device camera breath phase (inhale / exhale / hold) for NOOP's HRV meditation
status: draft
created: "2026-10-20"
updated: "2026-10-20"

evidence_status: literature-survey + synthetic-reproduction; recorded-clip gate pending (no real-video result yet)
external_inference_spend_usd: 0.0

hardware:
  build_and_tests: groot (x86_64 Linux, JDK 21, Gradle 8.7)
  target_device: Samsung Galaxy S25 (Snapdragon 8-class); on-device latency not yet measured (logged by the app under tag BreathCam)

sources:
  - repo: kvnloo/noop
    commit: e12cd056822a39438b8dc065b79803e29381fea1
    branch: feat/android-breath-camera
    role: estimator (com.noop.breathcam), JVM tests, recording protocol (Tools/breathcam), clip evaluator, docs/experiments/BREATH_CAMERA.md
    visibility: pushed

questions:
  - Which on-device camera method is most credible for live breath phase on Android?
  - Do published benchmarks report breath PHASE accuracy, or only respiration rate?
  - Does the chosen estimator recover multiple injected rates, holds and polarity on synthetic input?
  - Does it pass the recorded-clip gate (rate error <= 1 br/min at 4/6/10 br/min, phase accuracy >= 85%, hold recall/precision >= 80%, >= 6 clips)?
  - What does the HRV-biofeedback evidence support as the feedback the camera should drive?

