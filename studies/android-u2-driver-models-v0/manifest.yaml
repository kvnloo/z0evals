limitations:
  - Draft; no model has been run yet. Results (data/rows.jsonl, data/summary.json) are added in part 2 once the phone-queue API is live.
  - One device (S22+), one locale (en-US), one launcher (Nova). Oracles were written from the 2026-10-28 screens and can drift with One UI or app updates.
  - Tasks are read-only navigation only. No calculator app is installed, so no arithmetic task; Clock World clock is excluded because the redactor fails closed on it.
  - Oracle success is decided by the phone-queue service's tree_text check on the final hierarchy, not the driver's own done; the check was validated only against probed screens (pass on evidence, fail on home).
  - fx exposes only gateway, codex and grok providers; local SLM routing through the queue is an open contract question, and unreachable models are recorded as unavailable, not 0.
  - Codex-subscription models have no per-token price; cost is reported as tokens, and Luna/Terra were on a free promo per the owner.
  - Phone screen contents, alarm labels, account names and other PII are not published; only oracle strings and screen names are.

