questions:
  - On read-only S22+ navigation goals with independent tree-text oracles, how does oracle-verified task success compare across openai-codex Luna, Terra and Sol and local SLMs (Qwen3 0.6B to 14B, Nemotron-Orchestrator-8B, Qwen2.5-VL-3B, Qwen3-4B-Instruct)?
  - How much of the gap appears on multi-step goals versus single-step goals?
  - What are each model's wrong-act (false done or setting side effect) and abstain rates?
  - What are per-decision choose latency (p50/p95) and warm whole-task time, with cold model loads reported separately?
  - Which is the smallest local model whose success is within the Luna confidence interval, and at what latency and token cost?

