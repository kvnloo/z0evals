  - path: context-packet-fixtures.jsonl
    kind: dataset
limitations:
  - No live benchmark results are claimed by this scaffold.
  - Emma and AgentWeb production writes are outside the v0 experiment; tests are shadow, mocked, sandboxed, or read-only until explicitly promoted.
  - Transport success and completed tool calls are not quality labels.
