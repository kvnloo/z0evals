questions:
  - Can worker supervision (dispatch, heartbeats, interruption, resume/abandon, background processes, worktree leases, placement off groot, phone install lock and S25 foreground) be stated as a statechart whose owner-facing laws are machine-proven in Bend?
  - Are the laws load-bearing?
  - What does a deterministic, read-only replay of the real delegation logs, Hermes state, worktrees and fleet runs say about dropped workers, lease clashes and groot-vs-fleet build waits?

