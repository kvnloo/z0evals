limitations:
  - A Bend PASS covers fsm.bend's emitted book only (source_semantics_attested=false); it does not prove the Python twin or the event mapping.
  - Python/Bend agreement is measured on 400 worker + 100 lease + 100 device seeded tapes, not proven.
  - Heartbeats are the log's last write or the session's last activity; one long silent tool call looks like a stall.
  - Successor detection is heuristic (delegation id, branch, worktree or a RESUME goal with >=35% shared words, started after the old worker's last write); from_log means the successor named or read the old log.
  - heavy.lock waits are lower-bound estimates from disjoint lock holds and assume each command held the lock until it ended; background job ends come from process polls or the mtime of the log the command redirected into.
  - Lease clashes are attributed by written path; writes through scripts or symlinked paths are missed, and parent/child edits during the child's life count as clashes.
  - Heavy commands are classified by heavy.lock use or a build/test command pattern; GPU work and Bend/Lean count as the owner's standing exceptions.
  - The S25 is matched by its adb address from the fleet registry; adb over mDNS names is not counted.
  - Recommendations (resume / abandon / already integrated) are evidence for Kevin's decision; nothing was resumed, killed or deleted.

claims:
  - id: laws-proven
    text: "19 Bend claims under laws W1-W6 check, including the kernel recheck (receipt c1de0af0..., verdict pass)."
    evidence: [data/bend-receipt.json]
  - id: laws-load-bearing
    text: "17/17 mutants of fsm.bend that break a guarded behaviour make PROOF.bend fail under --verdict."
    evidence: [data/bend-mutations.json]
  - id: twin-parity
    text: "The Python twin equals the Bend model on 400 worker tapes (3,370 events, all 9 phases), 100 lease and 100 device tapes."
    evidence: [data/parity-seed7.json]
  - id: dropped-workers
    text: "26 workers are Overdue (interrupted or vanished, no resume from the log and no abandon within 2 h); all 13 of loop 1's dropped workers are among them, recommended 10 resume, 2 already integrated, 1 abandon."
    evidence: [data/supervise-public-20261021.json]
  - id: groot-waits
    text: "118 of 333 heavy.lock jobs on groot waited, about 21.5 h in total (median 3.9 min, max 74 min); 1,695 heavy commands ran on groot outside fleet-build without a GPU or Bend exception, 97 of them after the fleet came up; the fleet ran 36 jobs with no queue wait."
    evidence: [data/supervise-public-20261021.json]
  - id: lease-clashes
    text: "419 writes landed inside another session's worktree lease, across 19 worktrees."
    evidence: [data/supervise-public-20261021.json]
