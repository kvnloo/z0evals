questions:
  - How much wall time per GUI goal comes from model decisions versus observation, settle waits and device actions?
  - Can a local SLM on the RTX 3080 Ti choose the next GUI step on the compiled legal action set accurately enough to offload Jev (Shadow Network credit)?
  - Which question level can each SLM already win (curriculum start point)?
  - Do compiled macros and deterministic reads beat one-chooser-call-per-step loops on a real phone at equal verified success?
  - Which browser observation and settle policy is cheapest at equal verified success?

artifacts:
  - path: tasks/android-chooser-cases.v1.json
    kind: frozen-task-set
    provenance: redacted copy of hermes-phone-goal tests/eval/cases.json (46 cases; 26 recorded on the S22+, 20 synthetic)
  - path: tasks/browser-fixture/settings.html
    kind: frozen-task-set
    provenance: owned synthetic fixture with an independent window.__state oracle
  - path: data/shadow
    kind: result
    provenance: shadow decision receipts (passive predictions on the frozen fixture)
  - path: data/ladder
    kind: result
    provenance: difficulty-ladder probe receipts (passive predictions)
  - path: data/live/s22-r1.jsonl
    kind: result
    provenance: executed live read-only runs on the S22+, verifier independent of the GUI path
  - path: data/browser/cdp-r1.jsonl
    kind: result
    provenance: executed runs on the owned browser fixture
  - path: data/aux
    kind: result
    provenance: preserved failed/partial attempts (decider_2b with CUDA graphs; Jev ladder refused by contract)
  - path: analysis
    kind: analysis
    provenance: generated by harness/analyze_*.py from data/

limitations:
  - Shadow results are passive predictions on 46 frozen decisions, not executed outcomes; no candidate was promoted.
  - Gold labels come from one labeller (the phone_goal author); the SLM instruction text and the lexical rule were written after seeing the fixture.
  - Not preregistered; scoring was written after the Jev arms and the first z0int arms ran.
  - Live S22+ set is 3 read-only Settings goals x 3 reps x 4 arms; a tiny pilot, not a rate estimate.
  - Linux desktop GUI input was not run because the headless Sway isolation harness has not passed its independent safety review.
  - vLLM, unsloth inference and ExLlamaV2/V3 were not measured in this iteration (see curriculum.md for the plan); only transformers (z0int backends), llama.cpp and ollama.
  - GPU shared with other resident servers; local p95 includes contention.

