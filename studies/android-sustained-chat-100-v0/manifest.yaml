limitations:
  - Incomplete operational run, not a completed comparative benchmark or independently graded quality result.
  - The unpaired fx canary and initial wrong result channel violated the intended reusable-workflow baseline; no speedups are reported.
  - Initial outer pacing omission, pre-transport claim loss, and manual audited recovery remain in the record.
  - App, device, provider, account state, task, time, and mid-run protocol revision are confounded.
  - Historical dispatches retain their actual original payload revision; amendments do not retroactively change prior sends.
  - The largest 8090-character prepared brief is quarantined; delivery of that message is not proven.
  - S25 admission ended at 05:00 UTC; unsent tasks remain queued. At the snapshot cutoff, DeepSeek was waiting for another workflow's UI-lock release.
  - Existing phone telemetry is sampled, not continuous; it cannot rule out intervening throttling.
  - Mutable runtime files and declared repository bases do not certify a fully frozen reproducible live runner release.
  - Public artifacts omit prompts, answers, task tags, serials, local paths, screenshots, and raw traces.
