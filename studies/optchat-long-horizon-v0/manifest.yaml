limitations:
  - Context bytes only. No answer-quality verifier. Not a promotion.
  - The SoL-Pi house task is 12 files and n=12 paired trials, not 50 turns.
  - The free router has n_ctx=2048, so the compactor saw a 1600-character excerpt, not the gist 64k-token view.
  - The off arm is the accumulated transcript size. Live omp could not send turn 7+ on argv.
  - The current OMP hook adds the view beside the host transcript. This study measures the view against the transcript, which is the gist comparison, not that additive hook.
  - Source commit is the pin HEAD. OptChat itself is uncommitted on that tree.
  - "scoring is unscored. one context-size trajectory, no held-out answer check."

