questions:
  - After 50 tool-heavy turns, is the OptChat view smaller than the accumulated transcript?
  - Does that shrink on the same protocol used for SoL-Pi, extended from 12 files to 50?
  - Does a free local model actually build the nodes, or do placeholders remain?

