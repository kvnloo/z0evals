questions:
  - In the source's playback simulators, do the selected NVENC export recipes beat a naive x264 CRF23 upload on pooled mean and p5 VMAF?
  - How large are those differences per platform, and do they hold for VMAF NEG?
  - What does the extra quality cost in upload size?
  - Where does the selected recipe lose (the synthetic 10-bit blue gradient, per-clip regressions)?

