reproduction:
  - >-
    scripts/build_fframes_delivery.py site recomputes pooled mean and linear-interpolated p5
    (the rule in delivery/summarize.py) for VMAF and VMAF NEG from the 3,600 rows of
    frames.csv and fails if any of the 20 values per metric differs from summary.json by
    more than 1e-6. that is a reproduced aggregation of frozen per-frame scores, not a
    re-encode or re-score of any video.

limitations:
  - Simulator results, not measured gains on YouTube, Shorts, TikTok, Reels, or X. No account uploads occurred.
  - Recipe selection and evaluation used the same four clips. There is no held-out corpus.
  - Four real clips of 3 seconds (90 frames at 30 fps) each. Frames are correlated. No significance claim.
  - Not equal bitrate. Selected uploads are 3.23x to 3.92x the size of naive uploads per platform.
  - The synthetic 10-bit blue ramp is a counterexample. Naive wins VMAF there on both simulated platforms.
  - VMAF is not calibrated for small UI text or portrait phone viewing. CAMBI regressions exist inside the positive aggregate.
  - Self-review only in the source run. No independent reviewer.
  - The encoded videos themselves are not frozen here; only scores, sizes, and hashes recorded by the source.

claims:
  - id: simulator-pooled-gain
    text: >-
      In the source's five simulators, the selected recipes have higher pooled mean and p5
      VMAF than naive x264 CRF23 on the same four clips (source-reported; aggregation reproduced from frames.csv).
    evidence: [data/summary.json, data/frames.csv]
  - id: gradient-counterexample
    text: On the synthetic 10-bit blue ramp the selected H.264 recipe loses mean and p5 VMAF to naive in both simulated platforms.
    evidence: [data/gradient10.clean.json]
  - id: upload-cost
    text: The selected uploads are 3.23x to 3.92x larger than naive per platform, so the comparison is not equal-bitrate.
    evidence: [data/results.clean.json]
