private_inputs:
  - what: speed-offload and faithfulness task items, model outputs, judge rows and the speed-offload evidence file (cited upstream by sha256)
    location: operator host (~/.cache and ~/.z0int/evidence; not published)
  - what: transcripts, verified-outcome rows, labelling excerpts for the density precision sample, and the loop export table
    location: operator host (private state and research stores; not published)
  - what: the utilization run's raw JSON and the operator's counts-only write-up
    location: operator host (not published); the counts used here are copied from that write-up and labelled source-reported

questions:
  - Which worker task classes can a local groot model take from the frontier at equal quality and lower p95 latency (speed-first offload)?
  - Is the one class that qualified (summarize_tool_output) faithful enough to offload once faithfulness, not format, is measured?
  - How many live Claude Code turns get an independently verified outcome, and can new verifiers raise that share to 0.20?
  - Is there enough verified live data for a learned gate to be compared with the deterministic gate, and if not, how long until there is?
  - How often does z0 change what happens in the user's real agent work today?

pre_registrations:
  - experiment: speed-offload-v0
    prereg: d716a38
    results: 535b8af
    demotion: 2c0c339
    verdict: summarize_tool_output speed_qualified on a format-and-facts check (local 60/60 vs Haiku 59/60, p95 893 vs 2054 ms); the other four classes not_equivalent; after the faithfulness result no class is speed-qualified
  - experiment: summarize-faithfulness-v0 (decision 20)
    prereg: 2870516
    results: 9b8289c
    verdict: fail - hallucinated items 26.3% vs Haiku 13.2% (upper bound +18.9 pp vs +2 pp margin); critical-fact recall 0.816 vs 0.893 (lower bound -10.5 pp vs -5 pp margin); qwen3-14b (exploratory) also fails both
  - experiment: verification-density-v0 (z0intelligence#54)
    prereg: 4431225
    results: bd370e6
    squashed_into: b6abbd2
    verdict: T1 not met (0.129 vs target 0.20); T2 no verifier reached the precision bar, all demoted to low; T3 unchanged at 28 resolved/wk; T4 met (gh cold 36 s, warm 20 s); found the v0 piped-test defect (about 24% of v0 test-success signals were not passes)
  - experiment: verified-loop-v0
    prereg: ded915a
    results: 1b80a4e
    verdict: INSUFFICIENT_DATA (6 analysis rows, 1 not-success, 1 group); projection about 24 weeks to the sufficiency gate and about 30 weeks to 80% power on live volume
  - experiment: utilization-v0
    prereg: none (instrument baseline, not a test)
    verdict: 26.3% (51/194) at baseline, 27.9% (56/201) an hour later; all from ObservationPack shortening; 0 offloads, 0 enforced decisions

artifacts:
  - path: data/summary.json
    kind: result
    provenance: summarize.py over the pinned source files (git show at the commits above); aggregates only. The speed-offload rule is re-applied to the recorded numbers and matches the 535b8af statuses; the faithfulness non-inferiority calls are re-derived from the bounds; the loop sufficiency checks and weeks-to-gate/power are re-derived from the result counts; the density counts are checked against 20 anchor strings in the pinned document; utilization counts are source-reported
  - path: summarize.py
    kind: analysis
    provenance: public aggregation code

limitations:
  - Single principal. Every set, transcript and session comes from one operator's machines and repos over about one day.
  - The speed-offload sets are small (48-60 items per class) synthetic wrappers around z0 artefacts, not sampled route_worker traffic; frontier latency is duration_api_ms, which excludes CLI start (wall-clock p95 for claude -p was 4-6 s); the GPU was shared during the local run; Claude Code has no temperature control.
  - The speed-offload check for summarize_tool_output was format-and-facts (at most 40 words, file count as digits, one changed file named) on git-stat items only. It could not see invented outcomes, miscounts or dropped failures, which is the main lesson of this study.
  - The faithfulness judge is a single model (Sonnet), which is also an arm; it was blinded to arm, and the deterministic critical-fact recall and the contradicted-only robustness check point the same way. Mutation-made pytest failures are real output but not a sample of production failures. One Haiku item was dropped unjudged (1/160).
  - Verification density rests on 31 live turns and a precision sample of fewer than 50 firings per verifier; the pipe and install fixes were made after the labels were seen and are exploratory; the user-cue patterns were written after reading the prompts, so their recall is optimistic.
  - The piped-test defect means some v0 verified_success labels (and so some rows in the loop table, which was built before the fix) are suspect until re-verified.
  - The loop projection is a linear extrapolation of a one-day sweep with 1 observed live not-success; the planning not-success rate (0.043) is pooled across cohorts and the 834-row power target is very uncertain. 325 of the 331 swept sessions are eval/probe harness sessions with a different distribution.
  - The utilization headline is an operator run of the pinned instrument, not a pinned artifact; Hermes, OMP and Codex units are estimated from local counts; posture was BURN for the whole window, under which about 0 offloads is the designed behaviour.
  - Nothing here was promoted. No routing, capability entry, gate or verifier confidence changed because of these results, except the shadow-only demotion of summarize_tool_output.
