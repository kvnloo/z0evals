evidence_status: pre-registered-local-runs-aggregated plus one source-reported operator measurement (utilization); task items, model outputs, judge rows, transcript excerpts, labelling excerpts, session ids and per-turn rows are private upstream; only aggregates are published here
external_inference_spend_usd: null  # Haiku/Sonnet arms and the Sonnet judge ran through claude -p on the operator's Claude subscription (not metered here); local arms on groot; the density, loop and utilization parts make no model calls
base_note: branched from origin/main (fb14919), as the recent studies were; z0evals nightly lags (it does not carry the recent study merges on dev)

