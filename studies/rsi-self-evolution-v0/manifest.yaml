questions:
  - Does prediction-guided selection improve heldout keyword fitness over GEPA and random selection with matched task calls?
  - Does any keyword-fitness change agree with known-answer static-review verdict accuracy?
  - Does pre-update selected-only predictor correlation provide useful evidence at this sample size?
artifacts: []
limitations:
  - Measurement is in progress. No final quality comparison is frozen.
  - The native GEPA text adapter replaces a broken wrapper, not the GEPA engine.
  - The surrogate is sparse embedding regression, not JEPA.
  - The primary metric is keyword overlap, not independently verified task correctness.
  - One adapted prompt and eight unique holdout tasks do not establish live-agent improvement.
  - Selected-only Spearman is biased and has few observations.
  - Candidate-generation compute and distributions are not matched across all arms.
  - Failed and interrupted attempts must remain separate from valid quality measurements.
