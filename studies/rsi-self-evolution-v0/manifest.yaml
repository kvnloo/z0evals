questions:
- Does prediction-guided selection improve heldout keyword fitness over GEPA and random
  selection with matched task calls?
- Does any keyword-fitness change agree with known-answer static-review verdict accuracy?
- Does pre-update selected-only predictor correlation provide useful evidence at this
  sample size?
