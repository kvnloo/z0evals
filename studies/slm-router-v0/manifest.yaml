  - Which local SLM best handles bounded routing under latency and quality constraints?
  - How much does compiler-first legal-action filtering contribute independently of model quality?
  - Which roles require general reasoning versus a specialist or bounded scorer?
  - Does composing JEV or a small specialist ahead of a larger model improve the downstream decision?
  - What feature should Q-Route add before the first corpus-generation slice?

