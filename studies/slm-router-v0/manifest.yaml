limitations:
  - The z0intelligence and evolution-lab source commits are currently local-only, so this draft is not yet remotely reproducible.
  - The machine-readable summary is a transcription of the Phase 1B handoff; canonical raw receipts and generated reports remain authoritative and still need import.
  - Eight measured cells remain at n=2 in compiler+jev+qwen3.5_4b.
  - No measured cell reached n>=10.
  - The frozen gate utility ties correct-but-slow and wrong-but-fast at -1.000 on tool_fails under the 4000 ms budget.
  - The safety gate reads dangerous_rate selection rather than exposed_dangerous.
  - FunctionGemma and Hammer3B share the tiny_specialist rung, so the current gate does not compare them directly.
  - The first composition pass at max_tokens=512 produced empty Qwen content because thinking consumed the output budget; that failure is preserved but excluded from the corrected result.
  - The legacy D/E/F cascade sweep was intentionally stopped after the token-budget correction became higher priority.

claims:
  - id: bounded-default-hammer3b
    text: compiler -> Hammer2.1-3B is the measured default bounded-choice path in Phase 1B.
    evidence:
      - data/phase1b-summary.json
  - id: compiler-restores-safety
    text: compiler-first arms recorded zero dangerous selections while unfiltered Hammer2.1-3B recorded 6/84.
    evidence:
      - data/phase1b-summary.json
  - id: qwen4-orchestration-role
    text: Qwen3.5-4B did not improve bounded-choice success over Hammer2.1-3B but solved 31/40 orchestration scenarios.
    evidence:
      - data/phase1b-summary.json
  - id: composition-harmful
    text: the measured JEV and Hammer3B pre-composition variants reduced Qwen4B downstream correctness in the corrected composition evaluation.
    evidence:
      - data/phase1b-summary.json
  - id: residency-dominates
    text: cold-load and model-swap latency are order-of-magnitude system costs relative to the fastest warm bounded-choice routes.
    evidence:
      - data/phase1b-summary.json
  - id: next-feature-budget-units
    text: budget_units is the highest-value measured next runtime-observable feature for Q-Route.
    evidence:
      - data/phase1b-summary.json
