limitations:
  - One real database (about 655 MiB) from one user; other users' provider mix differs.
  - Turns are simulated with the devReplay ACP agent, not live provider turns.
  - Small n per arm (page size 10 tapped turns, group commit 16 tapped turns, 150 ms pilot 4); latency is noisy and p95 tails are wide.
  - The snapshot fold's in-pass latency was never measured (host memory pressure); bound only, longest fold transaction 49.8 ms.
  - Experiment 02 (snapshot fold) was dropped in favour of the open upstream PRs 29806 and 29811.
  - The live-traffic number is a source-reported replay estimate (one commit per event assumed, ingestion time as commit time), not re-run here.
  - Experiments were cut from different upstream main SHAs; none describe a later main.
  - The write tap counts syscalls, not device writes; client decode and render were not measured.
  - Raw per-run samples and the full ledger are not published; only sanitized aggregates are.
