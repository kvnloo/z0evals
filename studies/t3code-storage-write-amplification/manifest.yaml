questions:
  - Where do a turn's SQLite writes go, and does a short group-commit window cut them without a latency regression?
  - What would the same window rule save on live traffic (replay estimate)?
  - What does page size trade between file size and writes per turn?
  - Background - which byte classes make up a real state.sqlite, and how much is left for provider-owned history?
