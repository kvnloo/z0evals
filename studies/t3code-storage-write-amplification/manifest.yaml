questions:
  - Which byte classes make up a real T3 Code state.sqlite, and how much would each eviction policy save?
  - What does folding superseded snapshot bodies save, and how does that relate to upstream event pruning (PR 29806, PR 29811)?
  - Where do a turn's SQLite writes go, and do page size or a group-commit window change them?
  - How much is left for provider-owned history once the event log is pruned?
