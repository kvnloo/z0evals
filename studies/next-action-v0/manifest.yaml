claims:
  - id: c1-unused
    text: The existing desktop predictor recorded 7,859 shadow predictions, 19 ready-tier surfaces, 0 explicit commits and 0 accept/reject decisions in 30 days.
    evidence: [data/baseline-desktop-shadow.json]
  - id: c2-recency-beats-engine
    text: On app-switch outcomes a most-recently-used list gets top-1 0.771 / top-3 0.972, against the engine's 0.454 / 0.690.
    evidence: [data/baseline-desktop-shadow.json, data/mru_query.py]
  - id: c3-miscalibrated
    text: Engine predictions with confidence >= 0.82 (the ready gate) were top-1 correct 22.7% of the time (n=76).
    evidence: [data/baseline-desktop-shadow.json]

limitations:
  - The baseline is one person, one desktop, 30 days. The recency reconstruction uses prediction-time states, not every focus event.
  - rerank-v1's holdout covers all outcomes including noop, so it is not on the same subset as the recency row.
  - The new design has no data yet. E1 is pre-registered in README.md section 5.
  - Ring facts come from PR 65's single-session recordings. Quad and quint are unrecorded at this head.
