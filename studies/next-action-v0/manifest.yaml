questions:
  - Does a pull-only panel over high-manual-cost actions get used at least 3 times a day, where the push bar chip got 0 commits in 30 days?
  - Do the new action families beat a plain recency list (the withhold arm) on accept rate and measured time saved?
  - Does a calibrated accept-probability threshold (Cursor-style tau=0.25 in pull mode) keep reversals at or under 10% and abstentions at or under 50%?
  - Which ring patterns (quad, quint) clear recall >= 90%, downward confusion <= 2% and <= 0.5 false fires per hour, so they can carry keyboard STT and a next-action peek?

