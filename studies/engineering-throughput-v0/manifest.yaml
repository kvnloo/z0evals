questions:
  - Does a faster collection retain the useful facts obtained by the serial control, not merely the same row count?
  - Does the evaluation refuse a throughput claim when independent verification, elapsed-time scope, or first-use optimization cost is incomplete?
  - Does a bounded zero-priced model portfolio improve the current public-code inspection workflow enough to justify replacing the working baseline?

