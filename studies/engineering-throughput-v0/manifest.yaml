limitations:
  - One phone and one collection workflow are not independent population samples or a fleet-wide speed estimate.
  - The first concurrent candidate was faster but lost package inventory; it is rejected, not counted as savings.
  - Both original v2 primary gates failed against stale97-mount host state. Both fresh arm packets contained identical110-mount data and60packages, verified only retrospectively. Original failures remain unchanged.
  - Execution-plus-original-gate clocks are not independently verified-result latency. The evaluator withholds work-per-verified-result, throughput, quantiles and a positive adoption finding for these imported replay inputs.
  - Code/research effort, full optimization/first-use cost, local energy, and outer assistant/tool/UI latency are incomplete. No monetary ROI or global engineering speedup is claimed.
  - The fresh v3 predicate verifies only its prespecified useful package/CPU/root-mount/privacy/output contract. It does not verify complete host state or establish population non-inferiority.
  - In v3 the candidate user_services_enabled probe timed out whereas the control returned a nonzero error. Both remain unknown and neither supplied a successful fact; this diagnostic difference is retained, not claimed equivalent reliability.
  - Free-provider primary exact-object compliance was2/3 in both model arms. Required facts matched3/3 only as a secondary post-hoc check; extra fields were not factual errors. No thresholds were retroactively promoted to confirmation.
  - Deterministic source extraction initially shared its AST oracle, so it is not independent efficacy evidence. Separate actual shadow/quota operations later matched the required facts without model calls or tool execution.
  - All external inputs were immutable public-code packets. No private histories, evaluator truth, credentials, images or access inventory were sent to free models or imported here.
  - Gateway-reported cost0 is not an independent invoice, remaining-quota or unlimited-capacity guarantee. The portfolio was slower than Beam in this tiny diagnostic; no runtime routing switch follows.
  - No local SLM server was ready on this phone. No model download, training, GEPA/RSI run, SFT gain, learned shadow-network acceptance, production setup, fleet plan, K3s executor or merge is claimed.

claims:
  - id: bounded-native-collection-v3
    text: In one fresh same-host comparison, the fixed collector plus its bounded prospective verifier and measured preparation took11.280s versus31.121s,63.75percent lower observed work time, preserving its prespecified useful facts. This is not whole-assistant acceleration, full-host truth, independent custody, sustained throughput or complete first-use ROI.
    evidence:
      - data/iac-collection-v3.confirmation-facts.json
      - data/iac-collection-v3-confirmation.study.json
      - data/iac-collection-v3-confirmation.report.json
