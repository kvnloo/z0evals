limitations:
  - The pilot ran before PREREGISTRATION.md was committed; it is labelled pilot and is not the counted run.
  - Every non-accepted pilot call was a transport failure (Groq 413 on 32k inputs, 429s); no answer was graded wrong, so this pilot measures route reliability per task class more than answer quality.
  - n per family is tasks x 2 repeats (classify 2, reason 14, the rest 6); one task is worth up to 50 points on classify.
  - Client TTFT measured from groot includes network RTT; decode tok/s on short answers understates sustained throughput.
  - NVIDIA NIM is outside the z0int model-routing catalog's provider scope, so its findings are certified here but dropped at catalog import.

claims:
  - id: longctx-flip
    text: On taskfit.longctx Groq gpt-oss-20b and 120b were accepted 1/6 (five 413/429 failures) while OpenRouter nemotron-3.5-super-vl:free was accepted 6/6.
    evidence: [data/runs/pilot-20261103/result.json]
  - id: regrade-agreement
    text: All 140 answered pilot rows were re-graded from full text with the frozen graders; the runner's own flag disagreed on 0.
    evidence: [data/runs/pilot-20261103/result.json]
