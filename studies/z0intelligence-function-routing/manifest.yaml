    provenance: recomputed from the raw per-example capability-evidence JSONL in the pinned local revision
  - path: data/delegation-economics.json
    kind: result
    provenance: transcribed from frozen receipt cohorts in /home/kvn/Documents/ChatGPT/z0/receipts
  - path: data/provider-execution.json
    kind: result
    provenance: transcribed from frozen receipt cohorts; provider identity, tokens and canonical receipt ids preserved
