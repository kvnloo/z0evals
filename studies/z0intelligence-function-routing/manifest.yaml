hardware:
  gpu: NVIDIA RTX 3080 Ti
  vram_gb: 12

questions:
  - Does a model selected for a function actually execute it, or only get selected?
  - Does a fast local scorer solve the same objective as the reference verifier?
  - Does delegating a task to a competent remote worker reduce parent work?
  - How much concurrency does the shared authority admit before provider HTTP?
  - Can one canonical receipt authority guarantee replay, conflict rejection and refusal to re-execute uncertain work?

