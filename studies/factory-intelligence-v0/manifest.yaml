private_inputs:
  - what: tool-calling raw replies (model text) and serving metadata; z0_route request text and author function labels' source turns
    location: operator host (private research store; not published)
  - what: T3b episodes (Hermes state.db reduced to structural skeletons) and the audit key
    location: operator host (0600 private store; not published)
  - what: promotion-sim raw gh JSON and bare clones; the operator's write-up of the exploratory rules
    location: operator host (cache and research notes; not published). Exploratory numbers in this study are recomputed from the pinned public dataset.json, not copied from the note.

questions:
  - Does any small local model on groot form z0's own route_worker / delegate_worker calls (and BFCL v4 calls) better than, or as a cheaper substitute for, the farm default Qwen3-8B?
  - With an action space that matches what agents actually do after a tool failure, does a local-plasticity mushroom-body controller beat a trivial constant controller on expected recovery cost, and is it competitive with an MLP?
  - Replayed over every promotion the z0 factory made in September, which auto-merge rule would have held up on a time-split holdout?

