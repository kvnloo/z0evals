limitations:
  - Single principal. The z0_route items are one operator's Claude Code turns; the T3b episodes are one operator's Hermes agent history (mostly cron sources); the promotion history is one operator's nine repos over four weeks.
  - Tool-calling gold is partly author-labelled (the acceptable route_worker `function` set) and the 5 delegate_worker items carry a gold defect found while scoring (full request line vs subtask), which capped z0 form_exact at 43/48 = 0.896 and made the pre-registered >= 0.90 gate unreachable for every arm; a post-hoc sensitivity changes no verdict.
  - Tool-calling ran with thinking off, temperature 0, one sample per item, through one shared parser chain; BFCL is public and Hammer is tuned on BFCL-style tasks, so its BFCL numbers are an upper bound; FunctionGemma was run zero-shot although its card expects fine-tuning; VRAM is the bench process only on a shared GPU.
  - The action-selector suite has n=11 with 3 non-ACT items and is descriptive only.
  - T3b labels come from a structural rule over the next three turns, with recovery judged by a heuristic verifier; the blind audit (n=67, kappa 0.964) checked the rule against the definitions on structural skeletons, not the semantics in the text; the content-level owner audit has not been done.
  - T3b test has 1 ask and 1 abort, so the asymmetric parts of the cost matrix (missed ask = 4, wrong abort = 5) are essentially untested; no model predicts abort. 297 of 2,340 episodes were excluded as unverified.
  - Promotion-sim outcomes rest almost entirely on an SZZ "fix within 3 days" label (61 of 63 bad events on the 305 scorable; 0 reverts; 2 CI breaks, with post-merge code CI observable for only 115 events); the label counts some normal iteration as bad and misses add-only fixes.
  - Promotion-sim history is short and lumpy - z0evals is 36 of 91 holdout events, mostly one site sprint; agent attribution is unreliable (34 of 324 events tagged agent), which left H3 unscorable; `tested` is a static import proxy, not Promotion Authority v0's coverage rule, and judges Python only.
  - The promotion-sim exploratory rules were chosen after the holdout was seen; their zero-bad counts are upper-bounded (Wilson) at roughly 5-10%, not shown to be safe.
  - Nothing here changed runtime behaviour - no routing config, local_order, role default, controller, or merge policy was changed by these experiments.

claims:
  - id: toolcall-null
    text: On 184 frozen items (48 z0 route_worker/delegate_worker, 125 BFCL v4, 11 action-selector), no candidate beat the farm default Qwen3-8B (152/184) and none met the cheaper-substitute gates; Qwen3-14B (150, p=0.86) and Nemotron-Orchestrator-8B (148, p=0.39) were not distinguishable, and Qwen3.5-4B (137, p=0.028), Qwen3.5-9B (121), Hammer2.1-7B (86), Hammer2.1-3B (81) and zero-shot FunctionGemma-270M (63) were significantly worse (exact McNemar, re-derived from the committed pass flags).
    evidence:
      - data/summary.json
  - id: toolcall-z0-discriminates
    text: z0 route_worker formation separated the arms while the BFCL subset was close to saturated for the Qwen-family arms (103-114/125); Qwen3.5-9B called delegate_worker instead of route_worker on 24 of 43 route_worker items (no-think), and Hammer 2.1 formed almost no valid z0 calls (0/48 and 3/48 exact).
    evidence:
      - data/summary.json
  - id: toolcall-gate-defect
    text: The pre-registered z0 form_exact >= 0.90 gate was unreachable for every arm because of a delegate_worker gold defect; a labelled post-hoc sensitivity (Qwen3-8B 157/184) leaves the ranking and every eligibility verdict unchanged.
    evidence:
      - data/summary.json
  - id: t3b-primary
    text: On a frozen lineage split of real Hermes failure episodes (test n=379) with a six-action recovery space, the retrained mushroom-body controller (cost-decoded) had mean cost 0.288 vs 0.368 for the best constant (edit_retry), paired delta 95% CI [-0.131, -0.030] - the pre-registered primary endpoint passed.
    evidence:
      - data/summary.json
  - id: t3b-secondary
    text: The mushroom body was not shown competitive with an MLP under the pre-registered bar (delta -0.007, CI [-0.069, +0.056], bar upper < 0.05); ridge regression was the best single model (0.252), and the hand-written a-priori rule was worse than the constant (0.433, delta CI [+0.008, +0.119]).
    evidence:
      - data/summary.json
  - id: t3b-ask-abort-untested
    text: With 1 ask and 1 abort in test and no model ever predicting abort, the result speaks to noop / retry / edit_retry / switch_tool only.
    evidence:
      - data/summary.json
  - id: promotion-h1-fail
    text: Replayed over 324 promotion events (305 scorable) with a pre-registered time split, the train-picked rule auto[all,<=inf,nonsrc] auto-merged 65 of 91 holdout events with 11 bad (0.169; bar 0.115 = 0.5 x base 0.231), so H1 failed; 32 of the 71 all-green scorable PRs had no code check, only the receipt/label workflows.
    evidence:
      - data/summary.json
  - id: promotion-h2-h4
    text: Promotion Authority v0 ABSTAIN was weakly discriminative (10 bad of 39 across all scorable vs a 0.21 base; 1 of 4 on holdout), and pa_v0_auto (clean PA pass plus green code CI) auto-merged 14 holdout events with 0 bad (0/35 across train and holdout, Wilson upper bound 0.099).
    evidence:
      - data/summary.json
  - id: promotion-exploratory
    text: Exploratory, chosen after the holdout was seen and not pre-registered - docs-only changes with nothing red had 0 bad in 40 (13% of events), and pa_v0_auto with ABSTAIN sent to a human plus docs-only had 0 bad in 74 (24%, Wilson upper bound 0.049); auto_on_code_green had 3 in 52.
    evidence:
      - data/summary.json
