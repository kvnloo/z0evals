    results: b3a5fb0
    correction: 1f9473f
    verdict: null for every candidate - none better than qwen3_8b (rule 1), none eligible as a cheaper substitute (rule 2); qwen3_14b and nemotron not distinguishable; all four new candidates significantly worse pooled
  - experiment: t3b-action-space-v1
    prereg: 3cb0e50
    frozen_harness: 4b1015b
    results: ebb2e71
