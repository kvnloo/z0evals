limitations:
  - Primary metric is unweighted billed tokens (input + cache read + cache write + output); cache reads cost ~10x less than input and writes more, so cost_usd (Claude Code's estimate, not an invoice) is the closer billing proxy and is reported alongside.
  - One host, one model (Sonnet), one night; repo tasks are short (median ~5 tool calls), so long coding sessions may behave differently.
  - The long recall task has only 4 pairs per contrast (exploratory; no test).
  - qa questions share one pinned cwd per repo across arms (as in v0), so cache state is not controlled per arm there.
  - Under --strict-mcp-config (lean) the plugin's route_worker MCP server does not load, so worker (groot) routing is not exercised; DecisionOpportunity emission is shadow-only and never reaches the model. (Addendum v1b - fixed on feat/packet-gating-v0 - lean launch now passes --mcp-config with only the z0 server; route_worker listed and called in 3/3 probe sessions, PARENT_ONLY each time; no savings measured.)
  - The evolution-lab task ids were frozen after the qa suite had started (but before the repo suite); disclosed in PREREG.md.

claims:
  - id: full-integration-saves
    text: Pre-registered primary contrast - stock Claude Code vs lean + plugin State Packet + ObservationPack cut billed tokens 34.2% (ratio of totals, 95% task-cluster bootstrap CI -40.3% to -28.1%; 117/124 pairs cheaper; Wilcoxon on log ratios Holm p=3e-20) and Claude Code's cost estimate 45.4%, with task success 121/124 -> 124/124 (quality guard PASS).
    evidence: [data/results.json, data/trials.csv]
  - id: lean-replicates
    text: The lean launch profile alone cut billed tokens 31.8% pooled (CI -36.2% to -26.9%; 118/124 cheaper; Holm p=9e-21; cost -42.8%) at equal success (121/124 both), and every stratum agreed - repo cold -38.5% tokens / -54.2% cost, repo warm -33.8% / -32.0%, qa -25.5% - consistent with v0 (warm -27%, cold -64% cost).
    evidence: [data/results.json]
  - id: packet-task-dependent
    text: The State Packet's effect depends on the task family - on the v0 pinned held-out current-work questions it cut tokens a further 35.5% over lean (CI -45.4% to -23.4%, Holm p=1e-5) and raised correctness 42/44 -> 44/44, replicating v0 (stock -> lean+packet cost -62.7% here vs -61% in v0); on fresh coding/navigation tasks in new directories, where it has no session history to report, it added 10.8% tokens (CI +6.2% to +15.0%, Holm p=2.5e-4) with no quality change (79/80 -> 80/80). Pooled, the two cancel (-6.5%, n.s.).
    evidence: [data/results.json]
  - id: obspack-null-short
    text: ObservationPack had no measurable token effect on short tasks (pooled +3.0%, CI -2.9% to +9.0%, Holm p=0.20); it never packed on qa questions (0 packs in 44 trials), so the qa +7.6% difference is noise by construction.
    evidence: [data/results.json]
  - id: obspack-long-cost
    text: On the replicated v0 long recall task (n=4, exploratory) ObservationPack packed 7 outputs per run, roughly halved cache-write tokens and cut cost 41.5% (4/4 cheaper) while total unweighted tokens fell only 4.7% (one extra cache-read turn) - directionally consistent with v0's long-session result, and an example where the unweighted token metric understates a billing saving.
    evidence: [data/trials.csv]
  - id: v1b-gated-packet-fails-prereg
    text: "Addendum v1b (pre-registered, 372 trials, same suites): a prompt-gated State Packet (injected at UserPromptSubmit only for the fact families DecisionOpportunity scoping names, scoped to those families) FAILED both pre-registered tests against the v1 SessionStart packet. Repo tasks - session -> gated -7.3% tokens (CI -13.8% to +0.8%; 67/80 cheaper; Wilcoxon p=1.4e-5; cost -7.0%) misses the required CI < 0; gated vs plain lean was flat (median +0.1%, CI -13.6% to +6.7%) while the session packet was +4.7% (median +6.9%, 15/80 cheaper). qa questions - gated +16.6% vs the session packet (CI -4.8% to +45.6%) fails the +5% non-inferiority margin, though it still cut 17.8% vs lean (median -21.8%, p=0.002) at 44/44 correct. Quality guard PASS everywhere."
    evidence: [ADDENDUM-v1b.md, data/v1b/results.json, data/v1b/trials.csv]
