questions:
  - How much does the current z0 Claude Code integration (lean profile + plugin State Packet + ObservationPack) cut billed tokens versus stock Claude Code, at held task success?
  - Do v0's per-lever effects (lean, State Packet, ObservationPack) replicate with ~5x larger samples and fresh tasks from several repos?
  - Does any lever's saving depend on the task family (current-work questions vs coding/navigation; cold vs warm session)?

