limitations:
  - A Bend PASS covers fsm.bend's emitted book only (source_semantics_attested=false); it does not prove the Python checker or the event mapping.
  - Python/Bend agreement is measured on 400 seeded tapes, not proven.
  - The replay event mapping is heuristic (check-name filter for test receipts, goal/branch/worktree matching for resumes, 2 h TTL, 60 min vanish threshold).
  - Agents push and merge under the owner's GitHub account, so author/merger identity (L2) and who pressed merge (L1) are not observable; those findings are reported as indeterminate or flagged in the message.
  - GitHub keeps only the latest run per check; a re-run after merge can make a receipt look late.
  - The pre-20:43 Dash deployment is not recorded anywhere; the Dash "missing features" state is shown counterfactually (checkouts that would miss merged PRs), not as an observed deployment.
  - The in-process bend_verify tool failed with an adapter error (lean not on the Hermes process PATH); the passing evidence is the CLI receipt for the same input manifest.
  - kvnloo/noop is pinned at its main head at study time; its PR data came from the GitHub API, not a served checkout.

claims:
  - id: laws-proven
    text: "15 Bend claims under laws L1-L7 check, including the kernel recheck (receipt 9cebaacd..., verdict pass)."
    evidence: [data/bend-receipt.json]
  - id: laws-load-bearing
    text: "10/10 mutants of fsm.bend that break a guarded behaviour make PROOF.bend fail under --verdict."
    evidence: [data/bend-mutations.json]
  - id: twin-parity
    text: "The Python statechart equals the Bend model on 400 seeded tapes (5,077 events) reaching all 12 phases."
    evidence: [data/parity-seed7.json]
  - id: stale-deploy-reproduced
    text: "The replay flags the Company OS static service as 31 commits behind the integrated line, and that line as local-only; the z0intelligence service as diverged from origin/master with 27 uncommitted files."
    evidence: [data/replay-public-20261021.json]
  - id: unintegrated-work
    text: "13 interrupted or vanished workers had no resume, PR or abandon past the TTL; 32 merged PRs sit on branches that are on neither the default branch nor any running service."
    evidence: [data/replay-public-20261021.json]
  - id: receipts-missing
    text: "39 integrations had no passing receipt on the head at merge time, 7 of them Dash PRs merged before their tests finished."
    evidence: [data/replay-public-20261021.json]
