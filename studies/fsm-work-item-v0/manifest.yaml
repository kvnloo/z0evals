questions:
  - Can the agent work-item lifecycle be stated as a statechart whose owner-facing laws are machine-proven in Bend?
  - Are the laws load-bearing (does breaking the behaviour each law guards make the proof fail)?
  - Does a deterministic replay of real PR, service and worker evidence through the same machine reproduce the stale-deploy and unintegrated-work failures seen on 2026-10-20?

