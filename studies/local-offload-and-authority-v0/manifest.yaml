limitations:
  - Single principal. Every live cohort, transcript replay and label comes from one operator's Claude Code usage; in action-authority-v0 one session and its subagents carry 2,765 of 3,716 calls and all 291 parsed-privileged calls.
  - Gold is LLM-labelled. Effect-inference held-out cases and gate relabels, and all action-authority gold, were written by separate LLM agents from a label policy, not by the user; 10 of the 22 action-authority misses carry low-confidence gold, and two effect-inference v1 misses have disputed gold.
  - Small n. evidence_sufficiency is 48 items; the router eval has 59 labelled items (48 + 11); effect-inference held-out sets are 60 and 88; the live cohort is 10-11 linked turns.
  - Router outcomes are reused from single prior runs, so each candidate's pass/fail per item is one sample; S1 "cost" is measured latency, not price.
  - Orchestrator-8B was trained for multi-turn orchestration with frontier experts; a one-shot pick among small $0 local models is off-distribution for it, and temperature 0 deviates from the model card.
  - The offload admission bar (>=44/48) was proposed alongside the bench, not committed before it ran; Jev's 46/48 is source-reported from earlier work, not re-measured here.
  - The effect-inference v1 live-cohort table after a post-freeze detached-HEAD fix is reported next to the at-freeze table; the held-out result was scored once at the frozen commit.
  - Action-authority replay reconstructs the branch at call time only for the session repo, reads default branches from disk today, and bounds (does not measure) the candidate net's miss rate with 80 random non-candidates.
  - groot's GPU is shared with an unrelated Ollama instance; VRAM figures are approximate deltas.
  - Everything evaluated here is shadow-only; nothing was enforced on live traffic.

claims:
  - id: offload-tier-speed
    text: The same Qwen3-0.6B Q8 GGUF served from the RTX 3080 Ti farm answered the 48-item evidence_sufficiency set with a 41 ms median per item versus 1236 ms on the MacBook's Radeon (about 30x), at 27/48 vs 25/48.
    evidence:
      - data/summary.json
  - id: offload-tier-size
    text: On the same set, accuracy scaled with size on the farm - 0.6B 27/48, 1.7B 28/48, 4B 36/48, 8B 43/48 - with Qwen3-8B at a 90 ms median and 1 confident (>=0.9) error, one item short of the proposed >=44/48 admission bar; it is the OFFLOAD default, not an admitted Jev replacement.
    evidence:
      - data/summary.json
  - id: orchestrator-null
    text: Nemotron-Orchestrator-8B (thinking) beat the deterministic local order on choice accuracy (23/59 vs 8/59, McNemar p=0.0003) but tied a generic Qwen3-8B given the identical prompt (23/59 vs 23/59, 9 vs 9 discordant, p=1.0), so it failed the pre-registered rule and was not continued; a trivial cheapest rule (35/59) and a fixed strongest rule (pass rate 0.90 on S1) both did better.
    evidence:
      - data/summary.json
  - id: host-order-finding
    text: The deterministic arm's zero S1 accuracy came from host ordering (the host's own 1236 ms 0.6B listed before the farm's 41 ms copy of the same weights), which z0intelligence b072468 addressed with a host-chosen local_order.
    evidence:
      - data/summary.json
  - id: host-order-fix-confirmed
    text: Re-scored under a pre-registered addendum (0e90053 -> 336cb47) with the host's local_order [groot, local] on the same frozen S1/S2 items, outcomes and gold, the deterministic arm picks groot qwen3-8b on 48/48 S1 items - S1 pass 0.52 -> 0.90, mean regret 1.44 -> 0.13; pooled (n=59) choice accuracy 8/59 -> 12/59, pass 0.56 -> 0.86, regret 1.17 -> 0.11 (cheapest 0.35) - meeting the pre-registered confirmation reading (S1 pass >=0.85, regret below cheapest's 0.43); choice accuracy stays low by construction since gold is the cheapest passing model. The v0 orchestrator verdict is not re-adjudicated.
    evidence:
      - data/summary.json
  - id: effect-inference-v0-fails
    text: A deterministic prompt-effect classifier scored 80/80 in-sample but failed its pre-registered held-out bar - 6 false ACT on privileged (target 0; read-only baseline 20) with 1/20 unnecessary read ASKs and 47/60 class accuracy.
    evidence:
      - data/summary.json
  - id: effect-inference-v1-fails
    text: Adding scoped in-prompt grants (v1) fixed friction on granted work (ACT when granted in scope 18/21, unnecessary read ASK 0/20) but failed the pre-registered held-out bar with 8/27 privileged ACTs outside the granted scope (target 0); without grants the v1 lexicon reached 1/27 but asked on 20 of 21 granted instructions.
    evidence:
      - data/summary.json
  - id: turn-level-structural
    text: Structural finding from the v1 live cohort - a turn-level gate cannot see actions chosen mid-turn (a feature-branch push grant covered a default-branch push chosen later in the turn), so authority has to be checked against the actual tool call.
    evidence:
      - data/summary.json
  - id: action-authority-v0-fails
    text: A per-tool-call authority check replayed over 3,716 historical Claude Code calls (798 labelled) caught 112/134 unauthorized privileged calls (83.6%; target 100%, fail), with false friction 12.2% on the labelled sample (target <=5%, fail) and 2.3% population-weighted, and a hook p95 of 34 ms in a fresh interpreter (target <50 ms, pass).
    evidence:
      - data/summary.json
  - id: resource-posture-pending
    text: Resource posture v0 (BURN/BALANCED/OFFLOAD/RESERVE per budget pool) is shadow-only with a pre-registered posture-aware vs posture-blind replay; no result exists yet and none is claimed.
    evidence:
      - data/summary.json
