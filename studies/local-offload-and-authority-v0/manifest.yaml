questions:
  - Does a tailnet GPU box serving small Qwen3 models make a usable $0 OFFLOAD tier for bounded judgement work, and which size clears the bar?
  - Given only the legal candidates, does a learned orchestrator (Nemotron-Orchestrator-8B) route better than the deterministic order and than a generic 8B LLM with the same prompt?
  - Can a deterministic classifier infer from the user's prompt when a turn needs the human's authority, and do scoped in-prompt grants fix its friction without letting privileged work through?
  - Does checking authority per tool call (effects from the actual call, grants from intent) catch every unauthorized privileged action at acceptable friction and latency?
  - Would posture-aware routing (spend perishable frontier quota before reset, offload when it will run out) beat posture-blind routing? (pre-registered, pending)

